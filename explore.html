<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Roads explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0e1a">
<meta name="description" content="Explore any city street by street: roads light up as you travel them.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roads">
<link rel="stylesheet" href="vendor/leaflet/leaflet.min.css">
<style>
  :root {
    --radius: 16px;
    --card: rgba(255,255,255,.055);
    --card-hover: rgba(255,255,255,.09);
    --border: rgba(255,255,255,.10);
    --text: #e8eaf0;
    --text-dim: #9aa1b2;
    --accent: #7aa2ff;
    --accent-soft: rgba(122,162,255,.14);
    --danger: #ff6b6b;
    --shadow: 0 8px 32px rgba(0,0,0,.35);
    --gold: #ffd75e;
    --bg: #0b0e1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }

  /* ── top bar ────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: rgba(11,14,26,.92); backdrop-filter: blur(10px);
    z-index: 1000;
  }
  .topbar .brand { display: flex; align-items: baseline; gap: 10px; }
  .topbar .brand a { color: var(--text); text-decoration: none; font-size: 17px; font-weight: 700; }
  .topbar .brand a:hover { color: var(--accent); }
  .city-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 13.5px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: border-color .15s, background .15s;
  }
  .city-btn:hover { border-color: var(--accent); background: var(--card-hover); }
  .city-btn .pin { color: var(--accent); margin-right: 6px; }
  #loadState { font-size: 11px; color: var(--text-dim); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pct-wrap { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .pct { font-size: 26px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; text-shadow: 0 0 18px var(--accent-soft); }
  .pct small { font-size: 11px; font-weight: 500; color: var(--text-dim); margin-left: 4px; }
  .pct-bar { width: min(180px, 30vw); height: 7px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
  .pct-bar > div { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #4d70d8, var(--accent)); transition: width .6s ease; }
  .tbtns { display: flex; gap: 8px; }
  .tbtn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 13px; padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, background .15s;
  }
  .tbtn:hover { border-color: var(--accent); background: var(--card-hover); }
  .tbtn.on {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  .tbtn.on:disabled, .tbtn:disabled { opacity: .5; cursor: not-allowed; }
  .tbtn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; vertical-align: 1px; }
  .tbtn.on .dot { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }

  /* ── map ────────────────────────────────────────────── */
  #map { flex: 1; background: #0b0e1a; outline: none; position: relative; }
  .leaflet-container { background: #0b0e1a; font-family: inherit; }
  .leaflet-control-zoom a {
    background: #131725 !important; color: #e8eaf0 !important; border-color: rgba(255,255,255,.12) !important;
  }
  .leaflet-control-attribution {
    background: rgba(11,14,26,.8) !important; color: #6a7386 !important;
  }
  .leaflet-control-attribution a { color: #8a93a6 !important; }

  /* neighbourhood labels */
  .hood-label {
    color: rgba(232,234,240,.42); font-size: 11px; font-weight: 600; letter-spacing: .4px;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); white-space: nowrap; text-transform: uppercase;
    transform: translate(-50%, -50%); position: absolute;
  }
  .leaf-div { background: none; border: none; }

  /* ── empty state / gate ─────────────────────────────── */
  .gate {
    position: absolute; inset: 0; z-index: 2000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(60% 45% at 25% 10%, rgba(90,120,255,.14), transparent 70%),
                radial-gradient(50% 40% at 75% 90%, rgba(180,90,255,.10), transparent 70%),
                var(--bg);
    text-align: center; padding: 24px;
  }
  .gate[hidden] { display: none; }
  .gate .big { font-size: 52px; }
  .gate h1 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
  .gate p { color: var(--text-dim); font-size: 14px; max-width: 420px; line-height: 1.6; }
  .gate-search { display: flex; gap: 8px; width: min(460px, 92vw); margin-top: 6px; }
  .gate-search input {
    flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    color: var(--text); font-size: 16px; padding: 12px 18px; outline: none;
  }
  .gate-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .gate-search button {
    border: none; background: var(--accent-soft); color: var(--accent); font-weight: 600;
    font-size: 14px; padding: 0 20px; border-radius: 999px; cursor: pointer;
  }
  .gate-saved { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .gate-saved .chipx {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .gate-saved .chipx:hover { border-color: var(--accent); }
  .gate-status { font-size: 13px; color: var(--text-dim); min-height: 20px; }
  .gate-status.busy { color: var(--accent); }

  /* ── stats panel ────────────────────────────────────── */
  .stats-card {
    position: fixed; left: 14px; bottom: 14px; z-index: 900;
    width: 232px; max-height: min(64vh, 480px); overflow: auto;
    background: rgba(11,14,26,.94); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); backdrop-filter: blur(10px); padding: 12px 14px;
    transition: transform .25s ease;
  }
  .stats-card.folded { transform: translateX(-260px); }
  .stats-toggle {
    position: fixed; left: 10px; bottom: 10px; z-index: 901; display: none;
    border: 1px solid var(--border); background: rgba(11,14,26,.94); color: var(--text);
    border-radius: 999px; padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  @media (max-width: 720px) {
    .stats-card { width: calc(100vw - 20px); max-height: 40vh; left: 10px; bottom: 10px; }
    .stats-card.folded { transform: translateY(calc(100% + 16px)); }
    .stats-toggle { display: block; }
    .pct-bar { width: 26vw; }
    .topbar { padding: 10px 12px; gap: 8px; }
    .city-btn { max-width: 44vw; }
  }
  .stats-card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .stats-card h3 .fold { cursor: pointer; border: none; background: none; color: var(--text-dim); font-size: 13px; }
  .cls-row { margin-bottom: 8px; }
  .cls-row .head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .cls-row .head .n { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .cls-row .bar { height: 5px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
  .cls-row .bar > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s ease; }
  .cls-meta { margin-top: 10px; font-size: 11px; color: var(--text-dim); line-height: 1.7; }
  .cls-meta b { color: var(--text); font-weight: 600; }
  .tour-butns { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

  /* ── city dialog ────────────────────────────────────── */
  dialog {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; width: min(440px, 94vw);
    box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(3px); }
  dialog h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  #citySearch {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    color: var(--text); font-size: 15px; padding: 11px 16px; outline: none;
  }
  #citySearch:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #cityResults { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; }
  .c-res {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; font-size: 13.5px; text-align: left; width: 100%;
    border: none; background: transparent; color: var(--text);
  }
  .c-res:hover { background: var(--card-hover); }
  .c-res .c-sub { font-size: 11px; color: var(--text-dim); }
  .c-res .c-badge {
    margin-left: auto; font-size: 10.5px; color: var(--accent); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  }
  .c-res.saved-now { border: 1px dashed var(--accent); }
  #cityStatus { font-size: 12px; color: var(--text-dim); margin-top: 8px; min-height: 18px; }
  .c-row-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-dim); margin: 14px 0 6px; }
  .saved-list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; }
  .saved-list .s-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
    font-size: 13.5px; cursor: pointer; background: transparent; border: none; color: var(--text); width: 100%; text-align: left;
  }
  .saved-list .s-row:hover { background: var(--card-hover); }
  .saved-list .s-row .s-meta { margin-left: auto; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .saved-list .s-del { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 4px; }
  .saved-list .s-del:hover { color: var(--danger); }
  .d-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    font-size: 13px; padding: 8px 16px; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { background: var(--card-hover); }

  /* toasts */
  .toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(20,24,40,.96); border: 1px solid var(--border); color: var(--text);
    padding: 9px 18px; border-radius: 999px; font-size: 13px; z-index: 1200;
    box-shadow: var(--shadow); transition: opacity .3s, transform .3s; max-width: 92vw;
  }
  .toast.err { border-color: var(--danger); color: #ffb0b0; }
  @media (prefers-reduced-motion: reduce) {
    .pct-bar > div, .cls-row .bar > div { transition: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="index.html" title="Back to the starter page">✦ Roads</a>
    <button class="city-btn" id="cityBtn" title="Switch city"><span class="pin">📍</span><span id="cityName">Pick a city</span></button>
    <span id="loadState"></span>
  </div>
  <div class="pct-wrap">
    <span class="pct" id="pctBig">—<small></small></span>
    <div class="pct-bar"><div id="pctBar"></div></div>
  </div>
  <div class="tbtns">
    <button class="tbtn" id="trackBtn" title="Follow me and mark the roads I drive" disabled><span class="dot"></span>Track me</button>
    <button class="tbtn" id="locateBtn" title="Center the map on my position" disabled>📍</button>
  </div>
</header>

<div id="map" role="application" aria-label="City roads map">
  <div class="gate" id="gate">
    <div class="big">🗺️</div>
    <h1>Which city do you want to explore?</h1>
    <p>Type any city in the world — the whole city's streets are pulled from OpenStreetMap and light up as you drive them.</p>
    <form class="gate-search" id="gateForm">
      <input id="gateInput" type="text" placeholder="e.g. Toronto, Oslo, Nairobi…" autocomplete="off" spellcheck="false">
      <button type="submit">Find</button>
    </form>
    <div class="gate-saved" id="gateSaved"></div>
    <div class="gate-status" id="gateStatus"></div>
  </div>
</div>

<button class="stats-toggle" id="statsOpen" hidden>📈 Show stats</button>

<aside class="stats-card" id="statsCard">
  <h3>Exploration <button class="fold" id="statsFold" title="Fold away">▾</button></h3>
  <div class="cls-rows" id="clsRows"></div>
  <div class="cls-meta" id="clsMeta"></div>
  <div class="tour-butns">
    <button class="tbtn" id="fitBtn" title="Fit the whole loaded area in view" disabled>⤢ Fit</button>
    <button class="tbtn" id="resetBtn" title="Erase this city's tracked roads (cannot be undone)">Reset city</button>
  </div>
</aside>

<!-- city switch dialog -->
<dialog id="cityDialog">
  <h2>Cities</h2>
  <input id="citySearch" type="text" placeholder="Search a city — anywhere in the world…" autocomplete="off" spellcheck="false">
  <div id="cityStatus"></div>
  <div id="cityResults"></div>
  <div class="c-row-label" id="savedLabel">Saved on this device</div>
  <div class="saved-list" id="savedList"></div>
  <div class="d-actions"><button class="btn" id="cityClose">Done</button></div>
</dialog>

<script src="vendor/leaflet/leaflet.min.js"></script>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   Roads — a street-exploration map for the starter page. Any city,
   fully dynamic: search → OpenStreetMap boundary → Overpass download →
   packed & cached in IndexedDB → explore, track, persist progress.
   Map & place data: © OpenStreetMap contributors, ODbL.
   ════════════════════════════════════════════════════════════════════ */

const CLASSES = ['motorway','trunk','primary','secondary','tertiary','unclassified','residential'];
const CLS_LABEL = {
  motorway: 'Freeways', trunk: 'Expressways', primary: 'Arterials',
  secondary: 'Collectors', tertiary: 'Minor', unclassified: 'Unclassified', residential: 'Residential',
};
const BASE_STYLE = {
  motorway:    { color: '#565c6e', weight: 4.5, opacity: .95 },
  trunk:       { color: '#505564', weight: 4,   opacity: .95 },
  primary:     { color: '#4a4f5e', weight: 3.4, opacity: .92 },
  secondary:   { color: '#444957', weight: 2.8, opacity: .9 },
  tertiary:    { color: '#3e434f', weight: 2.4, opacity: .85 },
  unclassified:{ color: '#383d48', weight: 2,   opacity: .8 },
  residential: { color: '#333742', weight: 1.7, opacity: .8 },
};
const EXPLORED_STYLE = { color: '#7aa2ff', opacity: 1 };

/* ── IndexedDB: packed city data + per-city progress ── */
let idbPromise = null;
function idb() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    const rq = indexedDB.open('roads-explorer', 1);
    rq.onupgradeneeded = () => {
      const db = rq.result;
      if (!db.objectStoreNames.contains('cities')) db.createObjectStore('cities');
      if (!db.objectStoreNames.contains('progress')) db.createObjectStore('progress');
    };
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
  return idbPromise;
}
async function idbPut(store, key, val) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(store, key) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const rq = tx.objectStore(store).get(key); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
async function idbAllKeys(store) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const rq = tx.objectStore(store).getAllKeys(); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
async function idbDel(store, key) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

/* ── per-city progress (active working set) ─────────── */
let prog = { e: {}, trail: [], last: null, updated: 0 };   // current city's tracked state
let cityKey = null, cityName = null;
let savingTimer = null;
function freshProg() { return { e: {}, trail: [], last: null, updated: 0 }; }
async function loadProg(key) {
  const p = await idbGet('progress', key);
  return (p && typeof p === 'object') ? Object.assign(freshProg(), p) : freshProg();
}
function saveProgNow() {
  if (!cityKey) return;
  prog.updated = Date.now();
  renderStats();
  idbPut('progress', cityKey, prog).catch(() => {});
}
function saveProgDebounced() { clearTimeout(savingTimer); savingTimer = setTimeout(saveProgNow, 2500); }

/* legacy migration: the pre-multi-city build kept Edmonton in localStorage */
async function migrateLegacyEdmonton() {
  try {
    const raw = localStorage.getItem('starter-page-explore-v1');
    if (!raw) return;
    localStorage.removeItem('starter-page-explore-v1');
    const p = await idbGet('progress', 'edmonton-alberta-canada~legacy');
    if (p) return;                       // already migrated
    const old = JSON.parse(raw);
    await idbPut('progress', 'edmonton-alberta-canada~legacy', {
      e: old.e || {}, trail: old.trail || [], last: old.last || null, updated: Date.now(),
    });
  } catch {}
}

/* ── map ────────────────────────────────────────────── */
const map = L.map('map', { zoomSnap: .25, minZoom: 8, maxZoom: 19, zoomControl: true });
map.createPane('paneRiver');    map.getPane('paneRiver').style.zIndex = 401;
map.createPane('paneRoads');    map.getPane('paneRoads').style.zIndex = 402;
map.createPane('paneExplored'); map.getPane('paneExplored').style.zIndex = 403;
map.createPane('paneTrail');    map.getPane('paneTrail').style.zIndex = 404;
map.createPane('panePOI');      map.getPane('panePOI').style.zIndex = 405;
map.createPane('paneLabels');   map.getPane('paneLabels').style.zIndex = 406;
for (const p of ['paneRiver','paneRoads','paneExplored','paneTrail','panePOI']) {
  map.getPane(p).style.pointerEvents = 'none';
}
const RIVER = new L.Canvas({ pane: 'paneRiver' });
const ROADS = new L.Canvas({ pane: 'paneRoads' });
const EXP   = new L.Canvas({ pane: 'paneExplored' });
const TRAIL = new L.Canvas({ pane: 'paneTrail' });
const POIR  = new L.Canvas({ pane: 'panePOI' });

let roads = null;        // packed roads for the active city
let wayLayers = null;    // Map wayKey -> L.Polyline
let exploredLen = {};    // per class, metres (active city)
let trailLine = null;
let poiLayer = null, hoodLayer = null, riverLayer = null;

const percentEl = document.getElementById('pctBig');
const pctBar = document.getElementById('pctBar');
const loadState = document.getElementById('loadState');
const gate = document.getElementById('gate');
const gateStatus = document.getElementById('gateStatus');

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.body.append(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(-50%) translateY(-8px)'; }, 3000);
  setTimeout(() => el.remove(), 3500);
}
function esc(s) { const d = document.createElement('span'); d.textContent = s; return d.innerHTML; }

/* ── layer building (shared by cached & fresh data) ─── */
function packRoads(rawRoads) {
  // take a raw Overpass response and produce the compact app format
  const COS = Math.cos(53.5 * Math.PI / 180); // far-north or far-south cities get slightly off lengths; fine
  const segLen = (a, b) => {
    const dx = (b[0] - a[0]) * 111320 * COS, dy = (b[1] - a[1]) * 110540;
    return Math.sqrt(dx * dx + dy * dy);
  };
  const byClass = {}, totals = {}, bbox = [90, 180, -90, -180];
  for (const e of (rawRoads.elements || [])) {
    if (e.type !== 'way' || !e.geometry || e.geometry.length < 2) continue;
    const cls = e.tags && e.tags.highway;
    if (!CLASSES.includes(cls)) continue;
    const pts = e.geometry.map(p => [+p.lon.toFixed(5), +p.lat.toFixed(5)]);
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += segLen(pts[i - 1], pts[i]);
    if (len < 15) continue;                       // slivers
    (byClass[cls] = byClass[cls] || []).push({ i: e.id, g: pts });
    totals[cls] = (totals[cls] || 0) + len;
    bbox[0] = Math.min(bbox[0], pts[0][1], pts[pts.length - 1][1]);
    bbox[1] = Math.min(bbox[1], pts[0][0], pts[pts.length - 1][0]);
    bbox[2] = Math.max(bbox[2], pts[0][1], pts[pts.length - 1][1]);
    bbox[3] = Math.max(bbox[3], pts[0][0], pts[pts.length - 1][0]);
  }
  return {
    v: 2, bbox: [+bbox[1].toFixed(5), +bbox[0].toFixed(5), +bbox[3].toFixed(5), +bbox[2].toFixed(5)],
    classes: Object.fromEntries(CLASSES.filter(c => byClass[c]).map(c => [c, { n: byClass[c].length, lenM: Math.round(totals[c]) }])),
    ways: Object.fromEntries(CLASSES.filter(c => byClass[c]).map(c => [c, byClass[c]])),
  };
}

function packPOIs(raw) {
  const kindOf = t => {
    if (t.tourism === 'museum') return 'museum';
    if (t.tourism === 'artwork') return 'art';
    if (t.tourism === 'monument') return 'monument';
    if (t.tourism) return 'attraction';
    if (t.historic) return 'historic';
    if (t.amenity === 'hospital') return 'hospital';
    if (t.amenity === 'university' || t.amenity === 'college') return 'university';
    if (t.amenity === 'library') return 'library';
    if (t.amenity === 'marketplace') return 'market';
    if (t.leisure === 'stadium') return 'stadium';
    if (t.leisure === 'sports_centre' || t.leisure === 'recreation_ground') return 'sports';
    return null;
  };
  const out = [], seen = new Set();
  for (const e of (raw.elements || [])) {
    const t = e.tags || {};
    const name = t.name;
    if (!name) continue;
    const kind = kindOf(t);
    if (!kind) continue;
    let lo, la;
    if (e.type === 'node') { lo = +e.lon.toFixed(5); la = +e.lat.toFixed(5); }
    else if (e.geometry && e.geometry.length >= 3) {
      lo = +(e.geometry.reduce((s, p) => s + p.lon, 0) / e.geometry.length).toFixed(5);
      la = +(e.geometry.reduce((s, p) => s + p.lat, 0) / e.geometry.length).toFixed(5);
    } else continue;
    const dedupe = name + '|' + kind + '|' + la.toFixed(3) + '|' + lo.toFixed(3);
    if (seen.has(dedupe)) continue;
    seen.add(dedupe);
    out.push({ n: name, k: kind, lo, la });
  }
  return out;
}

function packExtras(raw) {
  const rivers = [], hoods = [];
  for (const e of (raw.elements || [])) {
    const t = e.tags || {};
    if (e.type === 'way' && e.geometry && e.geometry.length >= 2 && t.waterway === 'river'
        && /saskatchewan|/.test(t.name || '')) {   // any river — keep it generic worldwide
      rivers.push(e.geometry.map(p => [+p.lon.toFixed(5), +p.lat.toFixed(5)]));
    } else if (e.type === 'node' && t.name && (t.place === 'neighbourhood' || t.place === 'suburb')) {
      hoods.push({ n: t.name, lo: +e.lon.toFixed(5), la: +e.lat.toFixed(5) });
    }
  }
  return { river: rivers, hoods };
}

function initLayers(data, label) {
  roads = data;
  // flatten: simplified coordinate arrays + per-way length (matches earlier build)
  const COSx = Math.cos(53.5 * Math.PI / 180);
  const segLen = (a, b) => {
    const dx = (b[0] - a[0]) * 111320 * COSx, dy = (b[1] - a[1]) * 110540;
    return Math.sqrt(dx * dx + dy * dy);
  };
  const lz = [];
  for (const cls of CLASSES) {
    const arr = data.ways[cls] || [];
    for (const w of arr) {
      const pts = w.g;
      const outPts = [pts[0]];
      for (let i = 1; i < pts.length - 1; i++) {   // light thinning
        const [x1, y1] = outPts[outPts.length - 1], [x2, y2] = pts[i];
        if (Math.abs(x2 - x1) * 1e5 + Math.abs(y2 - y1) * 1e5 >= 0.7) outPts.push(pts[i]);
      }
      outPts.push(pts[pts.length - 1]);
      let len = 0;
      for (let i = 1; i < outPts.length; i++) len += segLen(outPts[i - 1], outPts[i]);
      lz.push({ cls, id: w.i, coords: outPts, len });
    }
  }
  roads.lz = lz;
  buildMatchIndex(lz);

  if (wayLayers) { wayLayers.forEach(p => map.removeLayer(p)); }
  wayLayers = new Map();
  for (const w of lz) {
    const base = Object.assign({}, BASE_STYLE[w.cls]);
    const p = L.polyline(w.coords.map(c => [c[1], c[0]]), Object.assign(base, { renderer: ROADS, interactive: false, pane: 'paneRoads' }));
    p.__yeg = w;
    wayLayers.set(w.cls + ':' + w.id, p);
    p.addTo(map);
  }

  // replay this city's stored exploration onto the fresh layers
  exploredLen = {};
  const sets = prog.e || {};
  for (const cls of CLASSES) {
    exploredLen[cls] = 0;
    const set = new Set(sets[cls] || []);
    for (const w of lz) {
      if (w.cls === cls && set.has(w.id)) {
        exploredLen[cls] += w.len;
        applyExplored(cls, w.id, true);
      }
    }
  }
  if (label) loadState.textContent = label;
  drawTrail();
  renderStats();
  gate.hidden = true;
  document.getElementById('trackBtn').disabled = false;
  document.getElementById('locateBtn').disabled = false;
  document.getElementById('fitBtn').disabled = false;
}
function polyLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += segLen(pts[i - 1], pts[i]); return s; }
const COS = Math.cos(53.5 * Math.PI / 180);
function segLen(a, b) {
  const dx = (b[0] - a[0]) * 111320 * COS, dy = (b[1] - a[1]) * 110540;
  return Math.sqrt(dx * dx + dy * dy);
}

/* ── spatial grid for proximity matching ────────────── */
let grid = null;
const CELL = 0.0018; // degrees ≈ 200 m
function buildMatchIndex(lz) {
  grid = new Map();
  for (let wi = 0; wi < lz.length; wi++) {
    const w = lz[wi];
    for (let i = 1; i < w.coords.length; i++) {
      const a = w.coords[i - 1], b = w.coords[i];
      const lo = (Math.min(a[0], b[0]) / CELL | 0), hi = (Math.max(a[0], b[0]) / CELL | 0);
      const loLat = (Math.min(a[1], b[1]) / CELL | 0), hiLat = (Math.max(a[1], b[1]) / CELL | 0);
      for (let cx = lo; cx <= hi; cx++) for (let cy = loLat; cy <= hiLat; cy++) {
        const k = cx * 100000 + cy;
        let bucket = grid.get(k);
        if (!bucket) grid.set(k, bucket = []);
        bucket.push([wi, i, a, b]);
      }
    }
  }
}
function pointSegDist(px, py, a, b) {
  const dx = (b[0] - a[0]) * 111320 * COS, dy = (b[1] - a[1]) * 110540;
  const ex = (px - a[0]) * 111320 * COS, ey = (py - a[1]) * 110540;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? (ex * dx + ey * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  const ox = ex - t * dx, oy = ey - t * dy;
  return Math.sqrt(ox * ox + oy * oy);
}
function matchPoint(lon, lat, radiusM) {
  const cx = lon / CELL | 0, cy = lat / CELL | 0;
  let newWays = 0;
  for (let ox = -2; ox <= 2; ox++) for (let oy = -2; oy <= 2; oy++) {
    const bucket = grid.get((cx + ox) * 100000 + (cy + oy));
    if (!bucket) continue;
    for (const [wi, i, a, b] of bucket) {
      if (pointSegDist(lon, lat, a, b) > radiusM) continue;
      const w = roads.lz[wi];
      const set = prog.e[w.cls] || (prog.e[w.cls] = []);
      if (!set.includes(w.id)) {
        set.push(w.id);
        exploredLen[w.cls] = (exploredLen[w.cls] || 0) + w.len;
        applyExplored(w.cls, w.id, false);
        newWays++;
      }
    }
  }
  return newWays;
}
function applyExplored(cls, id, silent) {
  const p = wayLayers.get(cls + ':' + id);
  if (!p) return;
  const b = BASE_STYLE[cls];
  p.setStyle(Object.assign({}, EXPLORED_STYLE, { weight: b.weight + 1.6, renderer: EXP, pane: 'paneExplored' }));
  if (!silent) p.bringToFront();
}

/* ── tracking ───────────────────────────────────────── */
let watchId = null, lastFix = null;
const trackBtn = document.getElementById('trackBtn');

function toggleTrack() {
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; trackBtn.classList.remove('on'); toast('Tracking paused'); return; }
  if (!navigator.geolocation) { toast('Geolocation is not supported here', true); return; }
  watchId = navigator.geolocation.watchPosition(onFix, onFixErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 45000 });
  trackBtn.classList.add('on');
  toast('Tracking — keep this screen open as you drive');
}
function onFix(pos) {
  const { latitude: lat, longitude: lon, accuracy: acc } = pos.coords;
  lastFix = { lat, lon, acc, t: Date.now() };
  if (acc > 100) return;
  const last = prog.trail[prog.trail.length - 1];
  const step = last ? segLen([last[1], last[0]], [lon, lat]) : Infinity;
  if (step < 8) return;                 // barely moved — skip
  prog.trail.push([lat, lon]);
  if (prog.trail.length > 2200) prog.trail = prog.trail.slice(-2000);
  prog.last = { lat, lon, t: Date.now() };
  const newWays = matchPoint(lon, lat, Math.min(60, Math.max(24, acc * 0.9)));
  drawTrail();
  renderStats();
  if (newWays > 0) { toast(`+${newWays} road${newWays > 1 ? 's' : ''} ✓`); saveProgNow(); }
  saveProgDebounced();
}
function onFixErr(err) {
  if (err && err.code === err.PERMISSION_DENIED) { toggleTrack(); toast('Location blocked — allow it in your browser settings', true); }
  else toast('Waiting for a location fix…');
}
function drawTrail() {
  if (trailLine) { trailLine.remove(); trailLine = null; }
  if (!prog.trail.length) return;
  trailLine = L.polyline(prog.trail.map(p => p), {
    color: '#ffd75e', weight: 2.5, opacity: .75, renderer: TRAIL, pane: 'paneTrail', interactive: false,
  }).addTo(map);
}
document.getElementById('locateBtn').addEventListener('click', () => {
  if (lastFix) map.setView([lastFix.lat, lastFix.lon], Math.max(map.getZoom(), 15));
  else if (!watchId) toggleTrack();
});

/* test hooks (harmless in production) */
window.__roads = {
  handlePosition: (lat, lon, acc = 10) => onFix({ coords: { latitude: lat, longitude: lon, accuracy: acc } }),
  stats: () => statsSnapshot(),
  get prog() { return prog; },
  search: doCitySearch,
  loadCity: cityFromResult,
  open: openCity,
  _packRoads: packRoads,
  state: () => ({ cityKey, cityName, loading: pipelineBusy, cached: roads ? true : false }),
};

/* ── stats ──────────────────────────────────────────── */
function statsSnapshot() {
  const total = roads ? CLASSES.reduce((s, c) => s + (roads.classes[c] ? roads.classes[c].lenM : 0), 0) : 0;
  const done = CLASSES.reduce((s, c) => s + (exploredLen[c] || 0), 0);
  return {
    pct: total ? done / total * 100 : 0, done, total,
    perClass: CLASSES.reduce((o, c) => { o[c] = { done: exploredLen[c] || 0, total: roads && roads.classes[c] ? roads.classes[c].lenM : 0, n: roads && roads.classes[c] ? roads.classes[c].n : 0 }; return o; }, {}),
    ways: roads ? roads.lz.length : 0,
  };
}
function renderStats() {
  const s = statsSnapshot();
  percentEl.innerHTML = '';
  percentEl.append((roads ? s.pct.toFixed(1) : '—') + '%');
  pctBar.style.width = Math.min(100, s.pct) + '%';
  // tiny summary for the homepage badge
  try { localStorage.setItem('starter-page-explore-summary', JSON.stringify({
    name: cityName || '', cityKey: cityKey || '', pct: +s.pct.toFixed(2),
    km: Math.round(s.total / 1000), touched: CLASSES.reduce((n, c) => n + (prog.e && prog.e[c] ? prog.e[c].length : 0), 0),
    ways: s.ways, t: Date.now() })); } catch {}
  if (!roads) return;
  const rows = document.getElementById('clsRows');
  rows.innerHTML = '';
  for (const cls of CLASSES) {
    const c = s.perClass[cls];
    if (!c || !c.total) continue;
    const pct = c.done / c.total * 100;
    const row = document.createElement('div'); row.className = 'cls-row';
    row.innerHTML = `<div class="head"><span>${CLS_LABEL[cls]}</span><span class="n">${pct.toFixed(1)}% · ${(c.total / 1000).toFixed(0)} km</span></div>` +
      `<div class="bar"><div style="width:${pct}%"></div></div>`;
    rows.append(row);
  }
  const touched = CLASSES.reduce((n, c) => n + (prog.e[c] ? prog.e[c].length : 0), 0);
  const meta = document.getElementById('clsMeta');
  meta.innerHTML = '';
  meta.append(
    Object.assign(document.createElement('b'), { textContent: `${touched} of ${s.ways}` }),
    ` roads touched ${document.createElement('br').outerHTML}`,
    `${(s.total / 1000).toFixed(0)} km of streets · `,
    prog.trail.length ? `${prog.trail.length} track points` : 'no track yet'
  );
}

/* ══════════════════ city pipeline ══════════════════ */
/* Search (Nominatim) → bbox → Overpass fetch (roads count, roads, pois,
   extras) → pack → cache in IndexedDB → load. Mirrors rotate on failure. */
const OVERPASS_MIRRORS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.osm.ch/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.osm.jp/api/interpreter',
];

async function ovQuery(queryText, onStatus) {
  let lastErr = null;
  for (let attempt = 0; attempt < 6; attempt++) {
    const url = OVERPASS_MIRRORS[attempt % OVERPASS_MIRRORS.length];
    try {
      onStatus && onStatus(`talking to OpenStreetMap (${url.split('/')[2]})…`);
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 420000); // big cities are genuinely big
      const r = await fetch(url, { method: 'POST', body: queryText, signal: ctl.signal,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const body = await r.text();
      if (body.slice(0, 10).toLowerCase().startsWith('<!doctype') || body.includes('<error>')) {
        throw new Error('Overpass busy');
      }
      return JSON.parse(body);
    } catch (e) {
      lastErr = e;
      onStatus && onStatus(`OpenStreetMap is busy — retry ${attempt + 1}/6…`);
      await new Promise(res => setTimeout(res, 4000 + attempt * 6000));
    }
  }
  throw lastErr || new Error('Overpass unavailable');
}


async function doCitySearch(q, onStatus) {
  const s = onStatus || (() => {});
  s('searching cities…');
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=en&q=' + encodeURIComponent(q);
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
  const r = await fetch(url, { signal: ctl.signal, headers: { 'Accept': 'application/json' } });
  clearTimeout(t);
  if (!r.ok) throw new Error('search failed: HTTP ' + r.status);
  const d = await r.json();
  // prefer real cities first
  d.sort((a, b) => {
    const rank = x => (x.type === 'city' || x.type === 'town' || x.type === 'municipality') ? 0
      : (x.type === 'administrative') ? 1 : 2;
    return rank(a) - rank(b);
  });
  return d.map(r0 => ({
    key: r0.osm_type + '/' + r0.osm_id,
    name: (r0.name || (r0.display_name || '').split(',')[0]),
    sub: (r0.display_name || '').split(',').slice(1, 4).join(',').trim(),
    bbox: (r0.boundingbox || [0, 0, 0, 0]).map(Number),   // [south, north, west, east]
    type: r0.type || '',
  })).filter(c => c.name && c.bbox.length === 4 && c.bbox.every(v => isFinite(v) && v !== 0));
}

async function cityFromResult(c, onStatus) {
  const status = onStatus || ((m) => { loadState.textContent = m; });
  // [south, north, west, east] from Nominatim
  const [sw_s, sw_n, sw_w, sw_e] = [c.bbox[0], c.bbox[1], c.bbox[2], c.bbox[3]];
  const countQ = `[out:json][timeout:90];way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential)$"](${sw_s},${sw_w},${sw_n},${sw_e});out count;`;
  const roadsQ = `[out:json][timeout:420];way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential)$"](${sw_s},${sw_w},${sw_n},${sw_e});out geom;`;
  const poisQ = `[out:json][timeout:150];(nwr["tourism"~"^(attraction|museum|artwork|monument)$"](${sw_s},${sw_w},${sw_n},${sw_e});nwr["historic"](${sw_s},${sw_w},${sw_n},${sw_e});nwr["amenity"~"^(hospital|university|library|marketplace)$"](${sw_s},${sw_w},${sw_n},${sw_e});nwr["leisure"~"^(stadium|sports_centre|recreation_ground)$"](${sw_s},${sw_w},${sw_n},${sw_e}););out geom;`;
  const extrasQ = `[out:json][timeout:150];(way["waterway"="river"](${sw_s},${sw_w},${sw_n},${sw_e});node["place"~"^(neighbourhood|suburb)$"](${sw_s},${sw_w},${sw_n},${sw_e}););out geom;`;

  status('checking city size…');
  const cnt = await ovQuery(countQ, status);
  const wayCount = (cnt.elements && cnt.elements.find(e => e.type === 'count' && e.tags) || { tags: {} }).tags.ways || 0;
  const estMB = Math.round(wayCount * 0.9 / 1000 * 10) / 10;
  if (wayCount > 130000 && !confirm(`${c.name}: ~${wayCount.toLocaleString()} streets (roughly ${estMB} MB to download once, cached afterwards). Continue?`)) {
    status('cancelled');
    return null;
  }
  status(`downloading ${c.name} (${wayCount.toLocaleString()} streets${estMB ? ', ~' + estMB + ' MB' : ''})…`);
  const t0 = Date.now();
  /* Overpass sometimes answers 200 with an empty elements array (it rate-limits
     the heavy street query instead of erroring). An empty set for a real city
     is always wrong here — retry, then surface it. */
  let rawRoads = null, rawPois = null, rawExtras = null;
  for (let roadsTry = 0; ; roadsTry++) {
    const [rr, rp, re] = await Promise.all([
      ovQuery(roadsQ, status),
      rawPois ? Promise.resolve(rawPois) : ovQuery(poisQ, status),
      rawExtras ? Promise.resolve(rawExtras) : ovQuery(extrasQ, status),
    ]);
    rawPois = rawPois || rp; rawExtras = rawExtras || re;
    const nRoads = (rr.elements || []).filter(e => e.type === 'way' && e.tags && e.tags.highway).length;
    if (nRoads > 0) { rawRoads = rr; break; }
    if (roadsTry >= 3) throw new Error('\'OpenStreetMap\' returned no street data — its servers are likely under load. Try again in a few minutes.');
    status(`the street data came back empty (servers busy) — retrying, ${3 - roadsTry} tries left…`);
    await new Promise(res => setTimeout(res, 6000 + roadsTry * 9000));
  }
  const rd = packRoads(rawRoads);
  const pois = packPOIs(rawPois);
  const ex = packExtras(rawExtras);
  const secs = Math.round((Date.now() - t0) / 1000);
  await idbPut('cities', c.key, { name: c.name, sub: c.sub, rd, pois, ex, updatedAt: Date.now() });
  status(`${c.name}: ${(JSON.stringify(rd).length / 1e6).toFixed(1)} MB cached · ${rd.lz ? rd.lz.length : Object.values(rd.ways).reduce((n, a) => n + a.length, 0)} streets · ${secs}s`);
  return { rd, pois, ex };
}

let pipelineBusy = false;
async function openCity(c, opts) {
  if (pipelineBusy) { toast('Still working on ' + currentLoadName + '…'); return; }
  pipelineBusy = true; currentLoadName = c.name;
  gateStatus.textContent = '';
  gateStatus.classList.add('busy');
  try {
    // cached copy?
    let bundle = await idbGet('cities', c.key);
    if (!bundle) {
      bundle = (await cityFromResult(c, m => {
        gate.hidden = true;
        loadState.textContent = m;
        gate.hidden = false;
        gateStatus.textContent = m;
      })) || null;
      if (!bundle) { pipelineBusy = false; currentLoadName = ''; return; }
    }
    // switch city + progress
    cityKey = c.key; cityName = bundle.name || c.name;
    localStorage.setItem('roads-last-city', cityKey);
    localStorage.setItem('roads-last-city-name', cityName);
    prog = await loadProg(cityKey);
    // legacy merge: fold the pre-multi-city Edmonton progress into the real city
    if (cityKey.startsWith('node/') || cityKey.startsWith('relation/')) {
      const legacy = await idbGet('progress', 'edmonton-alberta-canada~legacy');
      if (legacy && /edmonton/i.test(cityName || '')) {
        for (const cls of CLASSES) {
          if (legacy.e && legacy.e[cls]) {
            const set = new Set((prog.e[cls] || []).concat(legacy.e[cls]));
            prog.e[cls] = [...set];
          }
        }
        if (legacy.trail && legacy.trail.length && !prog.trail.length) prog.trail = legacy.trail;
      }
    }
    if (!opts || !opts.keepView) {
      map.fitBounds([[bundle.rd.bbox[1], bundle.rd.bbox[0]], [bundle.rd.bbox[3], bundle.rd.bbox[2]]], { animate: false });
    }
    if (riverLayer) riverLayer.remove();
    if (hoodLayer) hoodLayer.remove();
    initLayers(bundle.rd, cityName);
    renderPOIs(bundle.pois);
    renderRiver(bundle.ex.river);
    renderHoods(bundle.ex.hoods);
    document.title = `${cityName} — Roads explorer`;
    document.getElementById('cityName').textContent = cityName;
    toast(`${cityName} loaded · ${roads ? roads.lz.length.toLocaleString() : '?'} streets`);
  } catch (e) {
    console.error(e);
    gateStatus.classList.remove('busy');
    gateStatus.textContent = 'That didn\'t work — ' + (e && e.message || 'network hiccup') + '. Try again in a minute.';
    toast('City download failed — ' + (e && e.message || 'try again'), true);
  } finally {
    pipelineBusy = false; currentLoadName = '';
    gateStatus.classList.remove('busy');
  }
}
let currentLoadName = '';

/* ── city dialog UI ─────────────────────────────────── */
const cityDialog = document.getElementById('cityDialog');
document.getElementById('cityBtn').addEventListener('click', openCityDialog);
document.getElementById('cityClose').addEventListener('click', () => cityDialog.close());
function openCityDialog() {
  renderSavedCities();
  const resEl = document.getElementById('cityResults');
  resEl.replaceChildren();
  cityDialog.showModal();
  document.getElementById('citySearch').focus();
}
async function renderSavedCities() {
  const listEl = document.getElementById('savedList');
  const keys = await idbAllKeys('cities');
  listEl.replaceChildren();
  let progKeys = new Set(await idbAllKeys('progress'));
  const rows = [];
  for (const k of keys) {
    const c = await idbGet('cities', k);
    if (!c) continue;
    rows.push({ k, name: c.name, sub: c.sub, streets: (c.rd && c.rd.lz ? c.rd.lz.length : ((c.rd && Object.values(c.rd.ways) || []).reduce((n, a) => n + a.length, 0))),
      mb: c.rd ? (JSON.stringify(c.rd).length / 1e6) : 0 });
  }
  // also progress-only entries (migrated legacy data)
  for (const k of progKeys) {
    if (rows.some(r => r.k === k)) continue;
    rows.push({ k, name: k.startsWith('edmonton') ? 'Edmonton (older progress)' : k, sub: 'progress saved — map not cached', streets: 0, mb: 0 });
  }
  const label = document.getElementById('savedLabel');
  label.textContent = rows.length ? 'Saved on this device' : 'Nothing saved yet';
  for (const r of rows) {
    const row = document.createElement('button');
    row.className = 's-row';
    const nameSpan = document.createElement('span'); nameSpan.textContent = r.name;
    const meta = document.createElement('span');
    meta.className = 's-meta';
    meta.textContent = r.streets ? `${r.streets.toLocaleString()} streets · ${r.mb.toFixed(1)} MB` : r.sub || '';
    const del = document.createElement('button');
    del.className = 's-del'; del.textContent = '🗑'; del.title = 'Delete cached city';
    del.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('Delete ' + r.name + ' from this device (roads + progress)?')) return;
      await idbDel('cities', r.k); await idbDel('progress', r.k);
      if (r.k === cityKey) { cityKey = null; cityName = null; localStorage.removeItem('roads-last-city'); }
      renderSavedCities();
      toast(r.name + ' deleted');
    });
    row.append(nameSpan, meta, del);
    row.addEventListener('click', async () => {
      cityDialog.close();
      // progress rows without cached data can't render a map; only open cached ones
      const cached = await idbGet('cities', r.k);
      if (!cached) { toast('Open this via search to re-download the map', true); return; }
      openCity({ key: r.k, name: r.name, sub: r.sub, bbox: cached.rd.bbox.slice(0, 4) && [cached.rd.bbox[1], cached.rd.bbox[3], cached.rd.bbox[0], cached.rd.bbox[2]] });
    });
    listEl.append(row);
  }
}
async function runCitySearch(q, resEl, statusEl) {
  resEl.replaceChildren();
  statusEl.textContent = 'searching…';
  try {
    const results = await doCitySearch(q);
    statusEl.textContent = results.length ? 'Pick one:' : 'No matches — try another spelling or add the country.';
    for (const c of results) {
      const row = document.createElement('button');
      row.className = 'c-res' + ((await idbGet('cities', c.key)) ? ' saved-now' : '');
      const main = document.createElement('span'); main.textContent = c.name;
      const sub = document.createElement('span'); sub.className = 'c-sub'; sub.textContent = c.sub || c.type;
      const badge = document.createElement('span');
      badge.className = 'c-badge';
      badge.textContent = (await idbGet('cities', c.key)) ? 'saved' : 'download';
      row.append(main, sub, badge);
      row.addEventListener('click', async () => {
        cityDialog.close();
        gate.hidden = false;
        openCity(c);
      });
      resEl.append(row);
    }
  } catch (e) {
    statusEl.textContent = 'Search failed — ' + (e && e.message || 'network error') + '.';
  }
}
document.getElementById('citySearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const q = e.target.value.trim(); if (q) runCitySearch(q, document.getElementById('cityResults'), document.getElementById('cityStatus')); }
});
document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('gateInput').value.trim();
  if (!q) return;
  gateStatus.classList.add('busy');
  gateStatus.textContent = 'searching…';
  try {
    const results = await doCitySearch(q);
    gateStatus.classList.remove('busy');
    const saved = document.getElementById('gateSaved');
    saved.replaceChildren();
    if (!results.length) { gateStatus.textContent = 'No matches — try another spelling or add the country.'; return; }
    gateStatus.textContent = 'Top ' + Math.min(results.length, 4) + ' — pick one:';
    for (const c of results.slice(0, 4)) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chipx';
      b.textContent = (c.name || '') + ((c.sub || '').length ? ' · ' + c.sub.split(',').slice(-1)[0].trim() : '');
      b.addEventListener('click', () => { saved.replaceChildren(); openCity(c); });
      saved.append(b);
    }
  } catch (e2) {
    gateStatus.classList.remove('busy');
    gateStatus.textContent = 'Search failed — check your connection.';
  }
});

/* saved-city chips on the gate */
async function renderGateSaved() {
  const saved = document.getElementById('gateSaved');
  const keys = await idbAllKeys('cities');
  if (!keys.length) return;
  saved.replaceChildren();
  for (const k of keys.slice(0, 8)) {
    const c = await idbGet('cities', k);
    if (!c) continue;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chipx';
    b.textContent = '⚡ ' + c.name;
    b.addEventListener('click', () => openCity({ key: k, name: c.name, sub: c.sub, bbox: [c.rd.bbox[1], c.rd.bbox[3], c.rd.bbox[0], c.rd.bbox[2]] }));
    saved.append(b);
  }
}

/* ── boot ───────────────────────────────────────────── */
(async function boot() {
  await migrateLegacyEdmonton();
  // remember and reopen the last city, if any
  const last = localStorage.getItem('roads-last-city');
  if (last) {
    cityName = localStorage.getItem('roads-last-city-name') || '';
    document.getElementById('cityName').textContent = cityName || 'Loading…';
    const bundle = await idbGet('cities', last);
    if (bundle) {
      openCity({ key: last, name: bundle.name, sub: bundle.sub, bbox: [bundle.rd.bbox[1], bundle.rd.bbox[3], bundle.rd.bbox[0], bundle.rd.bbox[2]] });
      renderGateSaved();
      return;
    }
    // last city's data was deleted from cache — reopen fresh
    document.getElementById('cityName').textContent = 'Pick a city';
  }
  gate.hidden = false;
  await renderGateSaved();
  document.getElementById('gateInput').focus();
})();

/* flush pending state when closing */
window.addEventListener('beforeunload', saveProgNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgNow(); });

/* register the service worker (inherits the starter page's PWA) */
const secureEnough = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
if ('serviceWorker' in navigator && secureEnough) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
